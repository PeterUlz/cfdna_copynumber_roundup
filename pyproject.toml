[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name        = "cfdna-copy-number-roundup"
version     = "0.1.0"
description = "cfDNA copy-number analysis: ichorCNA + cBioPortal"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
cfdna-cnv = "cfdna_cnv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfdna_cnv"]
